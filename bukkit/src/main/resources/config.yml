# Kunftig - nametags
#
# Kunftig clients (1.7.10 + the Kunftig mod) see the full text: any length, 24-bit colors, gradients.
# Every other client sees a vanilla team prefix/suffix generated from the same text, cut to what the server
# accepts (16 characters below 1.13) without ever breaking a color code.
#
# Text format: MiniMessage (https://docs.advntr.dev/minimessage/format.html), and legacy codes still work:
#   &c &l &r ...  |  &#ff8800  |  &x&f&f&8&8&0&0  |  <gradient:#ff5555:#ffaa00>text</gradient>  |  <#ff8800>
# A value starting with { or [ is read as a JSON text component.
#
# Name style ("name"): colors and decorations separated by spaces, or a list.
#   one color = solid, two or more = gradient over the name, "plain" = no color but do not inherit the prefix's.
#   Example: name: "#ff5555 #ffaa00 bold"
#   Without "name" the prefix's last color carries into the name, as in vanilla 1.7.
#
# vanilla-prefix / vanilla-suffix (optional): what clients WITHOUT Kunftig see, instead of an automatically
# shortened prefix/suffix. Useful below 1.13, where only 16 characters fit: "Administrador" would become "Admini".

nametags:
  enabled: true

  # Ticks between passes that pick up permission changes and scoreboards switched by other plugins.
  sync-interval-ticks: 10

  # true: move players out of teams that other plugins put them in (on the same scoreboard).
  # false: leave those players alone.
  override-other-teams: true

  fallback:
    # Max characters of the vanilla prefix/suffix. auto = 16 below 1.13 (vanilla limit), unlimited from 1.13.
    # Raise to 32 only if EVERY client has NecroTempus 2.2+ (vanilla 1.7 clients disconnect on longer values).
    max-length: auto

  # The group with the highest priority among those whose permission the player has applies.
  # A group without permission applies to everyone. Group permissions default to false (also for OPs).
  # priority also orders the tab list on clients that sort by team (1.8+, NecroTempus): higher comes first.
  groups:
    admin:
      permission: kunftig.group.admin
      priority: 100
      prefix: "<gradient:#ff5555:#ffaa00><bold>Administrador</bold></gradient> <dark_gray>|</dark_gray> "
      vanilla-prefix: "&c&lADM &8| "
      name: "#ffaa00 #ff5555"
    vip:
      permission: kunftig.group.vip
      priority: 50
      prefix: "&#55ff55[VIP] "
      name: green
      suffix: " <yellow>★</yellow>"
    # default:
    #   priority: 0
    #   prefix: "<gray>"
    #   name: plain

# Log every Kunftig protocol message.
debug: false
