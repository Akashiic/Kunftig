name: Kunftig
version: '${version}'
main: com.akashic.kunftig.bukkit.KunftigPlugin
# Ignored by 1.7.10 Bukkit; tells Paper/Spigot 1.13+ this is not a legacy plugin.
api-version: '1.13'
author: Akashiic
description: Long, RGB and gradient nametags and tab names for Kunftig clients (1.7.10), with a safe vanilla fallback.
website: https://github.com/Akashiic/Kunftig
commands:
  kunftig:
    description: Kunftig nametags (status, reload, set, clear, preview).
    usage: /<command> <status|reload|set|clear|preview>
    permission: kunftig.admin
permissions:
  kunftig.admin:
    description: Use /kunftig.
    default: op
