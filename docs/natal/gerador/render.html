<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head><body style="margin:0;background:#fff">
<script type="module">
import * as THREE from 'three';
import { buildModel, shadeScene } from './viewer.js';
window.renderViews = async (model, views, size, steve) => {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
  renderer.setPixelRatio(1);
  renderer.setSize(size[0], size[1]);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  const out = [];
  for (const v of views) {
    const scene = new THREE.Scene();
    const { root } = buildModel(THREE, model);
    const pivot = new THREE.Group();
    pivot.add(root);
    if (v.steve && steve) {
      const s = buildModel(THREE, steve).root;
      const mb = new THREE.Box3().setFromObject(root);
      s.position.x = mb.min.x - 12;
      pivot.add(s);
    }
    scene.add(pivot);
    pivot.rotation.y = v.yaw * Math.PI / 180;
    await new Promise(r => setTimeout(r, 150));
    shadeScene(THREE, pivot);
    const box = new THREE.Box3().setFromObject(pivot);
    const cy = (box.min.y + box.max.y) / 2;
    const aspect = size[0] / size[1];
    const hh = Math.max((box.max.y - box.min.y) / 2, (box.max.x - box.min.x) / 2 / aspect) * 1.08;
    const cam = new THREE.OrthographicCamera(-hh * aspect, hh * aspect, hh, -hh, -1000, 1000);
    const el = v.pitch * Math.PI / 180;
    cam.position.set(0, cy + Math.sin(el) * 200, -Math.cos(el) * 200);
    cam.lookAt(0, cy, 0);
    const cx = (box.min.x + box.max.x) / 2;
    cam.position.x += cx; 
    renderer.render(scene, cam);
    out.push(renderer.domElement.toDataURL('image/png'));
  }
  return out;
};
window.ready = true;
</script></body></html>
